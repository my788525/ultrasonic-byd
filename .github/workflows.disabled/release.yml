name: Release

# Pushing a tag is the whole release: the APK is built and signed, update.json is written,
# both are attached to the GitHub release, and update.json is committed back to main so that
# the app has something to read.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing tag to release, for example v4.8.0-byd.15'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      # On a tag push the tag is the ref; when started by hand it comes from the input.
      RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up the Android SDK
        uses: android-actions/setup-android@v3

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::KEYSTORE_BASE64 is not set; the APK will be signed with the debug key."
          else
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/byd-ultrasonic.jks"
          fi

      - name: Build the release APK
        env:
          BYD_KEYSTORE_FILE: ${{ runner.temp }}/byd-ultrasonic.jks
          BYD_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          BYD_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          BYD_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew :ultrasonic:testReleaseUnitTest :ultrasonic:assembleRelease --no-daemon

      - name: Collect the version and hash the APK
        id: meta
        run: |
          APK=ultrasonic/build/outputs/apk/release/ultrasonic-release.apk
          VERSION_NAME=$(grep -m1 'versionName' ultrasonic/build.gradle | grep -oE '"[^"]+"' | tr -d '"')
          VERSION_CODE=$(grep -m1 'versionCode' ultrasonic/build.gradle | grep -oE '[0-9]+')
          OUT="NavMusic-${VERSION_NAME}.apk"
          cp "$APK" "$OUT"
          echo "apk=$OUT" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "sha256=$(sha256sum "$OUT" | cut -d' ' -f1)" >> "$GITHUB_OUTPUT"
          echo "size=$(stat -c%s "$OUT")" >> "$GITHUB_OUTPUT"

      - name: Write update.json
        env:
          TAG: ${{ github.ref_type == 'tag' && github.ref_name || inputs.tag }}
          VERSION_NAME: ${{ steps.meta.outputs.version_name }}
          VERSION_CODE: ${{ steps.meta.outputs.version_code }}
          SHA256: ${{ steps.meta.outputs.sha256 }}
          SIZE: ${{ steps.meta.outputs.size }}
        run: |
          python3 - "$GITHUB_REPOSITORY" <<'PY' > update.json
          import json, os, subprocess, sys

          repo = sys.argv[1]
          tag = os.environ["TAG"]
          name = os.environ["VERSION_NAME"]
          code = int(os.environ["VERSION_CODE"])
          apk = "NavMusic-%s.apk" % name

          # The changelog is the titles of the commits since the previous tag. With no
          # previous tag, everything up to this one is the changelog.
          previous = subprocess.run(
              ["git", "describe", "--tags", "--abbrev=0", tag + "^"],
              capture_output=True, text=True
          ).stdout.strip()
          revision_range = "%s..%s" % (previous, tag) if previous else tag
          log = subprocess.run(
              ["git", "log", revision_range, "--pretty=%s", "--no-merges"],
              capture_output=True, text=True
          ).stdout.strip()
          changelog = [line for line in log.splitlines() if line.strip()][:20]

          json.dump({
              "versionCode": code,
              "versionName": name,
              "downloadUrl": "https://github.com/%s/releases/download/%s/%s" % (repo, tag, apk),
              "sha256": os.environ["SHA256"],
              "size": int(os.environ["SIZE"]),
              "publishedAt": subprocess.run(
                  ["date", "-u", "+%Y-%m-%dT%H:%M:%SZ"], capture_output=True, text=True
              ).stdout.strip(),
              "changelog": changelog,
          }, sys.stdout, ensure_ascii=False, indent=2)
          PY
          cat update.json

      - name: Create the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$RELEASE_TAG" \
            --title "${{ steps.meta.outputs.version_name }}" \
            --generate-notes \
            "${{ steps.meta.outputs.apk }}" update.json

      - name: Commit update.json back to main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout main
          git add update.json
          if git diff --cached --quiet; then
            echo "update.json unchanged"
          else
            git commit -m "update.json for ${{ steps.meta.outputs.version_name }}"
            git push origin main
          fi
